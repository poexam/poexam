name: CI

on:
  - push
  - pull_request

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-15
          - macos-26
          - windows-2025
          - windows-11-arm

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get --yes --no-install-recommends install gettext

      # The matrix entries need distinct keys: two runners can share a host
      # triple (macos-15 and macos-26), which the automatic key does not
      # separate on its own.
      - name: Cache the cargo registry and the dependency build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Rust code formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D clippy::pedantic

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  # Exercise the release build, so a musl breakage shows up before the tag.
  musl:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      # Only the main branch writes the cache: a branch cache is visible to
      # that branch alone, so saving one per pull request would fill the cache
      # quota with entries nothing else can restore.
      - name: Cache the cargo registry and the dependency build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build and package the static musl binary
        run: tools/build-musl.sh --package
